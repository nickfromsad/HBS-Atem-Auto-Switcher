name: Build release

# Builds the Windows exe and the macOS app and publishes both as release v<APP_VERSION>.
# Start it from Actions → Build release → Run workflow (after bumping APP_VERSION).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller PyQt6 numpy sounddevice certifi PyATEMMax

      - name: Extract embedded icon
        shell: bash
        run: |
          python - <<'PY'
          import re, base64
          src = open("atem_switcher.pyw", encoding="utf-8").read()
          b64 = re.search(r'_ICON_B64 = "([^"]*)"', src).group(1)
          open("icon.ico", "wb").write(base64.b64decode(b64))
          PY

      - name: Build exe
        run: pyinstaller --onefile --windowed --icon icon.ico --name "HBS-ATEM-Auto-Switcher" atem_switcher.pyw

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('atem_switcher.pyw', encoding='utf-8').read()).group(1))")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          EXE="dist/HBS-ATEM-Auto-Switcher.exe"
          gh release create "$TAG" "$EXE" --title "$TAG" \
            --notes "HBS ATEM Auto Switcher $TAG. Windows: HBS-ATEM-Auto-Switcher.exe. macOS (Apple Silicon): HBS-ATEM-Auto-Switcher-*.dmg." \
            --repo "$GITHUB_REPOSITORY" \
          || gh release upload "$TAG" "$EXE" --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    # After the Windows job, so the release already exists.
    needs: windows
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv runs dmgbuild for the styled .dmg window
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: pip install pyinstaller PyQt6 numpy sounddevice certifi

      - name: Build app and dmg
        run: packaging/macos/build-mac.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.windows.outputs.tag }}" dist/HBS-ATEM-Auto-Switcher-*.dmg --clobber --repo "$GITHUB_REPOSITORY"
